<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title if title else 'MoE Dashboard' }}</title>
    <link rel="stylesheet" href="/static/css/tailwind.dist.css?v={{ ASSET_VER }}" />
    <link rel="stylesheet" href="/static/css/styles.css?v={{ ASSET_VER }}" />
  </head>
  <body>
    <header class="container header">
      <div class="brand">
        <div class="logo">🛰️</div>
        <h1>MoE Dashboard</h1>
      </div>
      <div class="status-row" style="gap:8px">
        <button id="theme-toggle" aria-label="Toggle theme" title="Toggle theme"
          style="width:30px;height:30px;border-radius:999px;background:var(--panel-2);color:var(--text);border:1px solid var(--border);font-weight:bold;line-height:26px;text-align:center;font-size:14px">☼</button>
        {% include 'partials/status.html' %}
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="container muted">
      <small>Offline • Python-only • Minimal</small>
    </footer>
    <script>
      (function(){
        // Theme toggle with persistence
        const key='theme';
        const applyLabel = (btn) => {
          const dark = document.documentElement.getAttribute('data-theme') === 'dark';
          if (btn) btn.textContent = dark ? '☾' : '☼';
        };
        try {
          const saved = localStorage.getItem(key);
          if (saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
        } catch(e){}
        const tbtn = document.getElementById('theme-toggle');
        if (tbtn) {
          applyLabel(tbtn);
          tbtn.addEventListener('click', function(){
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
              document.documentElement.removeAttribute('data-theme');
              try { localStorage.setItem(key,'light'); } catch(e){}
            } else {
              document.documentElement.setAttribute('data-theme','dark');
              try { localStorage.setItem(key,'dark'); } catch(e){}
            }
            applyLabel(tbtn);
          });
        }

        const btn = document.getElementById('fetch-decisions');
        if (!btn) return;
        const box = document.getElementById('decisions-box');
        btn.addEventListener('click', async function(){
          if (!box) return;
          if (box.style.display === 'block') { box.style.display = 'none'; return; }
          try {
            const resp = await fetch('/api/decisions?limit=20');
            const data = await resp.json();
            box.innerHTML = '';
            if (!Array.isArray(data) || data.length === 0) {
              box.innerHTML = '<div class="muted">No decisions yet</div>';
            } else {
              const list = document.createElement('div');
              list.style.fontSize = '12px';
              list.style.lineHeight = '1.4';
              data.forEach((d) => {
                const div = document.createElement('div');
                const status = (d.final && d.final.status) || '—';
                const agents = (d.assignedAgents || []).join(', ');
                div.innerHTML = `<span class="chip">${status}</span> <span class="mono">${d.requestId || ''}</span> • <span class="muted">${agents}</span>`;
                list.appendChild(div);
              });
              box.appendChild(list);
            }
            box.style.display = 'block';
          } catch (e) {
            box.innerHTML = '<div class="down">Failed to load decisions</div>';
            box.style.display = 'block';
          }
        });
      })();
    </script>
  </body>
</html>
