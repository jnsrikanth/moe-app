<section class="card accent-router" style="margin-top:12px">
  <div class="card-head"><h2>🧭 Router Settings</h2></div>
  <div class="card-body">
    <form id="router-form" class="grid form-grid">
      <label class="field" style="position:relative">
        <span class="label">Engine</span>
        <select id="engine">
          <option value="rules">Rules</option>
          <option value="ml">ML (Bandit)</option>
          <option value="moe">MoE (Gating)</option>
        </select>
        <div id="engine-info-balloon" class="muted" style="display:none; position:absolute; left:0; right:auto; top:62px; z-index:3; background:#0b1220; color:#d1d5db; border:1px solid #374151; border-radius:8px; padding:8px 10px; width:260px; box-shadow:0 8px 20px rgba(0,0,0,0.35)">
          <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:4px">
            <strong id="engine-info-title" style="font-size:13px">Engine</strong>
            <button type="button" id="engine-info-close" aria-label="Close"
              style="width:18px;height:18px;border-radius:50%;background:#111827;color:#e5e7eb;border:1px solid #374151;font-weight:bold;line-height:16px;text-align:center;font-size:11px">×</button>
          </div>
          <ul id="engine-info-list" style="margin:0 0 0 16px; padding:0; font-size:12px"></ul>
        </div>
      </label>
      <label class="field">
        <span class="label">MoE Mode</span>
        <select id="moe_mode">
          <option value="minimal">Not-so-pure (Top-1)</option>
          <option value="balanced" selected>Balanced (Top-2)</option>
          <option value="pure">Pure MoE (Aggressive multi)</option>
        </select>
      </label>
      <label class="field">
        <span class="label">MoE Top-K</span>
        <input id="moe_top_k" type="number" min="1" max="5" value="2" />
      </label>
      <label class="field">
        <span class="label">Multi-agent Margin</span>
        <input id="multi_margin" type="number" step="0.01" min="0" value="0.15" />
      </label>
    </form>
    <div class="row" style="margin-top:8px; gap:8px; flex-wrap: wrap;">
      <button id="apply-router" class="btn">Apply</button>
      <span id="router-status" class="muted"></span>
    </div>
  </div>
  <script>
    (async function(){
      const R = '{{ router_url }}';
      const engEl = document.getElementById('engine');
      const modeEl = document.getElementById('moe_mode');
      const kEl = document.getElementById('moe_top_k');
      const mEl = document.getElementById('multi_margin');
      const statusEl = document.getElementById('router-status');

      function engineInfo(engine){
        const e = (engine||'').toLowerCase();
        if (e === 'ml') {
          return { title: 'ML (Bandit)', items: [
            'Rules candidates + bandit selection.',
            'Learns from decisions (adaptive).',
            'Typically single-expert routing.',
          ]};
        }
        if (e === 'moe' || e === 'gating') {
          return { title: 'MoE (Gating)', items: [
            'Top‑K experts with configurable margin.',
            'Multi‑expert routing; bandit + optional model.',
            'Aggregates into a final decision.',
          ]};
        }
        return { title: 'Rules', items: [
          'Keyword + registry bias (deterministic).',
          'Always ready (no model).',
          'Simple baseline; single expert.',
        ]};
      }

      function showEngineInfo(engine){
        const box = document.getElementById('engine-info-balloon');
        const title = document.getElementById('engine-info-title');
        const list = document.getElementById('engine-info-list');
        const meta = engineInfo(engine);
        if (box && title && list){
          title.textContent = meta.title;
          list.innerHTML = '';
          meta.items.forEach((t)=>{ const li = document.createElement('li'); li.textContent = t; list.appendChild(li); });
          box.style.display = 'block';
        }
      }

      function hideEngineInfo(){
        const box = document.getElementById('engine-info-balloon');
        if (box) box.style.display = 'none';
      }

      async function load() {
        try {
          const resp = await fetch(R + '/router/config');
          if (!resp.ok) throw new Error('Router config not available');
          const cfg = await resp.json();
          engEl.value = (cfg.engine || 'rules');
          modeEl.value = (cfg.moe_mode || 'balanced');
          kEl.value = (cfg.moe_top_k || 2);
          mEl.value = (cfg.multi_margin || 0.15);
        } catch(e) {
          statusEl.textContent = 'Router config unavailable';
        }
      }

      async function save() {
        const body = {
          engine: engEl.value,
          moe_mode: modeEl.value,
          moe_top_k: parseInt(kEl.value || '2', 10),
          multi_margin: parseFloat(mEl.value || '0.15'),
        };
        try {
          const resp = await fetch(R + '/router/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          if (!resp.ok) throw new Error('Apply failed');
          const out = await resp.json();
          statusEl.textContent = 'Applied';
          setTimeout(()=> statusEl.textContent='', 1500);
        } catch(e) {
          statusEl.textContent = 'Failed to apply';
        }
      }

      document.getElementById('apply-router').addEventListener('click', save);

      // Info balloon behavior: show on select click/change, hide on close or outside click
      engEl.addEventListener('click', ()=> showEngineInfo(engEl.value));
      engEl.addEventListener('change', ()=> showEngineInfo(engEl.value));
      document.getElementById('engine-info-close').addEventListener('click', hideEngineInfo);
      document.addEventListener('click', (e)=>{
        const box = document.getElementById('engine-info-balloon');
        if (!box) return;
        if (e.target === engEl || box.contains(e.target)) return;
        hideEngineInfo();
      });

      load();
    })();
  </script>
</section>
