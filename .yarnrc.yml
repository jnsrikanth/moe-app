# Yarn Berry configuration
# Use node_modules linker for broad tool compatibility
nodeLinker: node-modules

# Ensure cache is committed inside the repo for zero-installs
enableGlobalCache: false

# Keep good compression ratio without being too slow
compressionLevel: mixed

# Use the vendored Yarn CLI (no Corepack or global Yarn required)
yarnPath: .yarn/releases/yarn-4.10.2.cjs

# Prefetch platform-specific packages for offline installs on multiple OS/CPU
# This allows us to commit the necessary prebuilt artifacts in .yarn/cache.
supportedArchitectures:
  cpu:
    - x64
    - arm64
  os:
    - darwin
    - linux
    - win32
  libc:
    - glibc
    - musl
